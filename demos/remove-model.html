<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/gh/3dvue/api@v4/viewer-3dvue-min.js"></script>
    <style> viewer-3dvue { width: 100%; min-height: 500px; } </style>
</head>
<body>
<div class="container">

    <h4 class="mt-4 mb-3">remove-model</h4>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">removeModel(objectIndex)</h5>
            <p class="text-muted">Retire un objet de la scène par son index. Démarre avec 2 objets.</p>
            <button id="btn-remove-0" class="btn btn-danger mr-2">removeModel(0) — 1er objet</button>
            <button id="btn-remove-1" class="btn btn-warning">removeModel(1) — 2e objet</button>
        </div>
    </div>

    <viewer-3dvue name="demo" src="https://demo-api.3dvue.fr/?p=010105040c-010105040c"></viewer-3dvue>

</div>
<script>
    const viewer = document.querySelector('viewer-3dvue[name="demo"]');
    document.getElementById('btn-remove-0').addEventListener('click', () => viewer.removeModel(0));
    document.getElementById('btn-remove-1').addEventListener('click', () => viewer.removeModel(1));
</script>
</body>
</html>
