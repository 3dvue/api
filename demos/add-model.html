<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/gh/3dvue/api@v4/viewer-3dvue-min.js"></script>
    <style> viewer-3dvue { width: 100%; min-height: 500px; } </style>
</head>
<body>
<div class="container">

    <h4 class="mt-4 mb-3">add-model</h4>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">addModel(id)</h5>
            <p class="text-muted">Ajoute un ou plusieurs objets à la scène existante sans la vider.</p>
            <button id="btn-add" class="btn btn-primary">addModel("04~~~~~~~~~~~~~~")</button>
        </div>
    </div>

    <viewer-3dvue name="demo" src="https://demo-api.3dvue.fr/?p=010105040c"></viewer-3dvue>

</div>
<script>
    const viewer = document.querySelector('viewer-3dvue[name="demo"]');
    document.getElementById('btn-add').addEventListener('click', () => {
        viewer.addModel("04~~~~~~~~~~~~~~");
    });
</script>
</body>
</html>
