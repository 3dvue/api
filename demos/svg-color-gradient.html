<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/gh/3dvue/api@v4/viewer-3dvue-min.js"></script>
    <style>
        viewer-3dvue { width: 100%; min-height: 500px; }

        .color-row {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .color-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .color-group label {
            font-size: 12px;
            color: #6c757d;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .color-group input[type=color] {
            width: 48px;
            height: 36px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 2px;
            cursor: pointer;
        }
        .color-group .sub-label {
            font-size: 11px;
            color: #adb5bd;
            margin: 0;
        }
        .gradient-stops {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .gradient-preview {
            height: 8px;
            width: 60px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .divider {
            width: 1px;
            height: 40px;
            background: #dee2e6;
        }
    </style>
</head>
<body>
<div class="container">

    <h4 class="mt-4 mb-3">svg-color-gradient</h4>

    <div class="card mb-3">
        <div class="card-body">
            <div class="color-row">

                <div class="color-group">
                    <label>Tasse — dégradé</label>
                    <div class="gradient-stops">
                        <div>
                            <p class="sub-label mb-1">Color 1</p>
                            <input type="color" id="stop-0" value="#00dbff">
                        </div>
                        <div>
                            <p class="sub-label mb-1">Color 2</p>
                            <input type="color" id="stop-1" value="#0100ef">
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </div>

    <viewer-3dvue name="demo" src="https://demo-api.3dvue.fr/?p=020p"></viewer-3dvue>

</div>
<script>
    const viewer  = document.querySelector('viewer-3dvue[name="demo"]');
    const stop0   = document.getElementById('stop-0');
    const stop1   = document.getElementById('stop-1');

    stop0.addEventListener('input', (e) => {
        viewer.setSVGElementParam('colorStop.0', e.target.value, 'color-base');
    });

    stop1.addEventListener('input', (e) => {
        viewer.setSVGElementParam('colorStop.1', e.target.value, 'color-base');
    });

</script>
</body>
</html>
