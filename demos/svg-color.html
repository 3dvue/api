<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/gh/3dvue/api@v4/viewer-3dvue-min.js"></script>
    <style>
        viewer-3dvue { width: 100%; min-height: 500px; }

        .color-row {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .color-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .color-group label {
            font-size: 13px;
            color: #6c757d;
            margin: 0;
            white-space: nowrap;
        }
        .color-group input[type=color] {
            width: 40px;
            height: 32px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">

    <h4 class="mt-4 mb-3">svg-color</h4>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">setSVGElementParam('fill', color, id)</h5>
            <div class="color-row">
                <div class="color-group">
                    <label>Tasse</label>
                    <input type="color" id="color-base" value="#ffcffb">
                </div>
                <div class="color-group">
                    <label>Anse</label>
                    <input type="color" id="color-anse" value="#ffcffb">
                </div>
                <div class="color-group">
                    <label>Coeur</label>
                    <input type="color" id="color-coeur" value="#bb00ee">
                </div>
            </div>
        </div>
    </div>

    <viewer-3dvue name="demo" src="https://demo-api.3dvue.fr/?p=020b"></viewer-3dvue>

</div>
<script>
    const viewer = document.querySelector('viewer-3dvue[name="demo"]');

    document.getElementById('color-base').addEventListener('input', (e) => {
        viewer.setSVGElementParam('fill', e.target.value, 'color-base');
    });

    document.getElementById('color-anse').addEventListener('input', (e) => {
        viewer.setSVGElementParam('fill', e.target.value, 'color-anse');
    });

    document.getElementById('color-coeur').addEventListener('input', (e) => {
        viewer.setSVGElementParam('fill', e.target.value, 'color-coeur');
    });
</script>
</body>
</html>
